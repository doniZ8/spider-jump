<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Spider Jump</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="stat">🏆 Платформы: <b id="score">0</b></div>
  <div class="stat">🪙 Монеты: <b id="coins">0</b></div>
  <div class="stat">❤️ Жизни: <b id="lives">0</b></div>
</div>

<aside id="shop">
  <div class="shop-title">🛒 БУСТЫ</div>
  <button class="boost" id="jetpackBtn"><span class="icon">🚀</span><b>Джетпак</b><small>+50 платформ</small><strong>🪙 50</strong></button>
  <button class="boost" id="tripleBtn"><span class="icon">🕷️</span><b>Тройной прыжок</b><small>3 прыжка подряд</small><strong>🪙 25</strong></button>
  <button class="boost" id="lifeBtn"><span class="icon">❤️</span><b>Доп. жизнь</b><small>Продолжить после падения</small><strong>🪙 200</strong></button>
  <div id="shopMessage"></div>
</aside>

<div id="mobileControls"><button id="leftBtn">◀</button><button id="rightBtn">▶</button></div>

<div id="startScreen" class="overlay">
  <div class="panel">
    <h1>🕷️ Spider Jump</h1>
    <p>Прыгай по платформам и поднимайся всё выше.</p>
    <p><b>A / D</b> — движение · <b>ЛКМ / Space</b> — прыжок</p>
    <p>Каждые 5 платформ дают <b>+5 🪙</b>.</p>
    <button id="startBtn" class="main-btn">Начать игру</button>
  </div>
</div>

<div id="gameOverScreen" class="overlay hidden">
  <div class="panel">
    <h1>💀 Игра окончена</h1>
    <p>Результат: <b id="finalScore">0</b> платформ</p>
    <p>Монеты: <b id="finalCoins">0</b></p>
    <button id="restartBtn" class="main-btn">Сыграть ещё</button>
  </div>
</div>

<div id="lifeScreen" class="overlay hidden">
  <div class="panel">
    <h1>❤️ Ты упал!</h1>
    <p>У тебя есть дополнительная жизнь.</p>
    <button id="useLifeBtn" class="main-btn">Продолжить</button>
    <button id="endBtn" class="secondary-btn">Закончить игру</button>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
